name: Pavion RTS - Enterprise Polyglot CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend API (TypeScript / Node.js 20 / Prisma / PostgreSQL)
  # -------------------------------------------------------------
  backend-api-check:
    name: Backend API & Prisma Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: TypeScript Compile & Build
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Frontend Web App (TypeScript / React 18 / Vite / MUI)
  # -------------------------------------------------------------
  frontend-web-check:
    name: Frontend React Web Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Build & Bundle Check
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Python AI Microservice (Python 3.12 / FastAPI / Scikit-learn)
  # -------------------------------------------------------------
  python-ai-check:
    name: Python AI Microservice & Matcher Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-engine
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run AI Engine Unit Tests
        run: python -m unittest test_ai_engine.py

  # -------------------------------------------------------------
  # Job 4: Go Fast Search Indexer (Go 1.22 / Goroutines / Inverted Index)
  # -------------------------------------------------------------
  go-indexer-check:
    name: Go Search Indexer & Inverted Index Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/indexer
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Build Go Indexer Binary
        run: go build -o indexer main.go

  # -------------------------------------------------------------
  # Job 5: DevOps & Infrastructure (Shell Scripts & Docker Syntax)
  # -------------------------------------------------------------
  devops-infrastructure-check:
    name: Infrastructure & Shell Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/setup_dev.sh
          bash -n scripts/backup_postgres.sh
          bash -n scripts/deploy.sh
          echo "All shell scripts passed syntax checks."

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
